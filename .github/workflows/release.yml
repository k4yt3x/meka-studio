name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # Run by hand, it builds every file a release has, as the run's artifacts, and publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.versions.outputs.version }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the versions, and the tag against them
        id: versions
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const cargo = readFileSync('../Cargo.toml', 'utf8');
          const crate = /^\[workspace\.package\][^[]*?^version = "([^"]+)"/m.exec(cargo)?.[1];
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version))
            throw new Error(`package.json's version ${version} is not major.minor.patch.`);
          if (process.env.GITHUB_EVENT_NAME === 'push' && tag !== version)
            throw new Error(`Tag ${tag} must match package.json's version ${version}.`);
          if (lock.version !== version || lock.packages[''].version !== version)
            throw new Error('package-lock.json must match package.json.');
          if (crate !== version) throw new Error(`Cargo.toml's version ${crate} must match ${version}.`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`Building Meka Studio ${version}`);
          NODE
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interface
          path: web/dist
          if-no-files-found: error

  binaries:
    needs: interface
    strategy:
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: aarch64-macos
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: x86_64-windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
      BINARY: meka-studio-${{ matrix.name }}${{ matrix.exe }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interface
          path: web/dist
      # musl-gcc builds the vendored OpenSSL and SQLite into a binary that runs on any Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      # Git's Perl, which may come first on Windows' path, cannot configure the vendored OpenSSL.
      - if: runner.os == 'Windows'
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - run: cargo build --release --locked --target "$TARGET" -p meka-studio
      - run: cp "target/$TARGET/release/meka-studio${{ matrix.exe }}" "$BINARY"
      - name: Check the binary runs
        run: ./"$BINARY" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meka-studio-${{ matrix.name }}
          path: ${{ env.BINARY }}
          if-no-files-found: error

  desktop:
    needs: interface
    strategy:
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            python: python3
          - name: aarch64-macos
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            python: python3
          - name: x86_64-windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interface
          path: web/dist
      # The interface's packages, whose licenses go in the third-party notices.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      # The webview, the tray icon, patchelf for the AppImage, and the GStreamer plugins it carries.
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install --yes
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      # Git's Perl, which may come first on Windows' path, cannot configure the vendored OpenSSL.
      - if: runner.os == 'Windows'
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - run: ${{ matrix.python }} crates/meka-studio-desktop/fetch-meka.py "$TARGET"
      - run: >
          ${{ matrix.python }} crates/meka-studio-desktop/notices.py "$TARGET"
          crates/meka-studio-desktop/binaries/THIRD-PARTY-NOTICES.txt
      - if: runner.os != 'Windows'
        run: cargo install tauri-cli --version 2.12.5 --locked
      # The AppImage's WebKitGTK plays sound through GStreamer, whose plugins it must carry: it
      # finds none of the system's. Tauri's bundler gathers them on Ubuntu.
      - name: Bundle the app with its Meka
        if: runner.os != 'Windows'
        working-directory: crates/meka-studio-desktop
        run: >
          cargo tauri build --target "$TARGET" --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"resources":{"binaries/meka":"meka","../../LICENSE":"LICENSE",
          "binaries/THIRD-PARTY-NOTICES.txt":"THIRD-PARTY-NOTICES.txt"},
          "linux":{"appimage":{"bundleMediaFramework":true}}}}'
      - name: Name the bundles
        if: runner.os != 'Windows'
        run: |
          bundle="target/$TARGET/release/bundle"
          for file in "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage "$bundle"/dmg/*.dmg; do
            [ -e "$file" ] || continue
            cp "$file" "meka-studio-desktop-${{ matrix.name }}.${file##*.}"
          done
          ls meka-studio-desktop-*
      # Windows gets an Inno Setup installer and a portable zip, which Tauri's bundler does not
      # make. The feature is the one `cargo tauri build` adds, which serves the start page from
      # the program rather than from a development server.
      - name: Build the app
        if: runner.os == 'Windows'
        run: >
          cargo build --release --locked --target "$TARGET" -p meka-studio-desktop
          --features tauri/custom-protocol
      - name: Gather the app's files
        if: runner.os == 'Windows'
        run: |
          mkdir meka-studio-desktop
          cp "target/$TARGET/release/meka-studio-desktop.exe" LICENSE \
            crates/meka-studio-desktop/binaries/meka.exe \
            crates/meka-studio-desktop/binaries/THIRD-PARTY-NOTICES.txt meka-studio-desktop/
      # From Inno Setup's own GitHub release: the address Chocolatey's package downloads it from
      # no longer serves it.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-6.7.1.exe"
          Invoke-WebRequest -OutFile $setup `
            https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe
          $sha256 = '4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0'
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $sha256) {
            throw "$setup does not have the SHA-256 $sha256"
          }
          $installed = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT',
            '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$env:RUNNER_TEMP\inno"
          if ($installed.ExitCode) {
            throw "Inno Setup's installer ended with $($installed.ExitCode)"
          }
      # In PowerShell, as Git's Bash turns ISCC's /-options into paths.
      - name: Make the installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.interface.outputs.version }}
        run: >
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Q
          "/DAppVersion=$env:VERSION" "/DBundle=$PWD\meka-studio-desktop" "/O$PWD"
          crates\meka-studio-desktop\windows\meka-studio-desktop.iss
      # The marker makes the copy portable, keeping its data in a data folder beside it.
      - name: Make the portable zip
        if: runner.os == 'Windows'
        run: |
          : > meka-studio-desktop/.portable
          7z a -tzip "meka-studio-desktop-${{ matrix.name }}-portable.zip" meka-studio-desktop
          ls meka-studio-desktop-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meka-studio-desktop-${{ matrix.name }}
          path: meka-studio-desktop-*
          if-no-files-found: error

  publish:
    needs: [binaries, desktop]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: meka-studio-*
          merge-multiple: true
          path: release
      - name: Write the notes
        run: |
          chmod +x release/meka-studio-*
          awk -v version="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      # A draft, which goes out once someone has looked it over and published it on GitHub.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --draft --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
