name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the tag against the versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const cargo = readFileSync('../Cargo.toml', 'utf8');
          const crate = /^\[workspace\.package\][^[]*?^version = "([^"]+)"/m.exec(cargo)?.[1];
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag ?? '') || tag !== version)
            throw new Error(`Tag ${tag} must match package.json's version ${version}.`);
          if (lock.version !== version || lock.packages[''].version !== version)
            throw new Error('package-lock.json must match package.json.');
          if (crate !== version) throw new Error(`Cargo.toml's version ${crate} must match ${version}.`);
          console.log(`Releasing Meka Studio ${version}`);
          NODE
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interface
          path: web/dist
          if-no-files-found: error

  binaries:
    needs: interface
    strategy:
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: aarch64-macos
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: x86_64-windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
      BINARY: meka-studio-${{ matrix.name }}${{ matrix.exe }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interface
          path: web/dist
      # musl-gcc builds the vendored OpenSSL and SQLite into a binary that runs on any Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      # Git's Perl, which may come first on Windows' path, cannot configure the vendored OpenSSL.
      - if: runner.os == 'Windows'
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - run: cargo build --release --locked --target "$TARGET" -p meka-studio
      - run: cp "target/$TARGET/release/meka-studio${{ matrix.exe }}" "$BINARY"
      - name: Check the binary runs
        run: ./"$BINARY" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meka-studio-${{ matrix.name }}
          path: ${{ env.BINARY }}
          if-no-files-found: error

  desktop:
    needs: interface
    strategy:
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            python: python3
          - name: aarch64-macos
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            python: python3
          - name: x86_64-windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interface
          path: web/dist
      # The interface's packages, whose licenses go in the third-party notices.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      # The webview and tray icon, and patchelf for the AppImage.
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install --yes
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # Git's Perl, which may come first on Windows' path, cannot configure the vendored OpenSSL.
      - if: runner.os == 'Windows'
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - run: ${{ matrix.python }} crates/meka-studio-desktop/fetch-meka.py "$TARGET"
      - run: >
          ${{ matrix.python }} crates/meka-studio-desktop/notices.py "$TARGET"
          crates/meka-studio-desktop/binaries/THIRD-PARTY-NOTICES.txt
      - if: runner.os != 'Windows'
        run: cargo install tauri-cli --version 2.12.5 --locked
      - name: Bundle the app with its Meka
        if: runner.os != 'Windows'
        working-directory: crates/meka-studio-desktop
        run: >
          cargo tauri build --target "$TARGET" --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"resources":{"binaries/meka":"meka","../../LICENSE":"LICENSE",
          "binaries/THIRD-PARTY-NOTICES.txt":"THIRD-PARTY-NOTICES.txt"}}}'
      - name: Name the bundles
        if: runner.os != 'Windows'
        run: |
          bundle="target/$TARGET/release/bundle"
          for file in "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage "$bundle"/dmg/*.dmg; do
            [ -e "$file" ] || continue
            cp "$file" "meka-studio-desktop-${{ matrix.name }}.${file##*.}"
          done
          ls meka-studio-desktop-*
      # Windows gets an Inno Setup installer and a portable zip, which Tauri's bundler does not
      # make. The feature is the one `cargo tauri build` adds, which serves the start page from
      # the program rather than from a development server.
      - name: Build the app
        if: runner.os == 'Windows'
        run: >
          cargo build --release --locked --target "$TARGET" -p meka-studio-desktop
          --features tauri/custom-protocol
      - name: Gather the app's files
        if: runner.os == 'Windows'
        run: |
          mkdir meka-studio-desktop
          cp "target/$TARGET/release/meka-studio-desktop.exe" LICENSE \
            crates/meka-studio-desktop/binaries/meka.exe \
            crates/meka-studio-desktop/binaries/THIRD-PARTY-NOTICES.txt meka-studio-desktop/
      - if: runner.os == 'Windows'
        run: choco install innosetup --version 6.7.1 --allow-downgrade --yes --no-progress
      # In PowerShell, as Git's Bash turns ISCC's /-options into paths.
      - name: Make the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q
          "/DAppVersion=$env:GITHUB_REF_NAME" "/DBundle=$PWD\meka-studio-desktop" "/O$PWD"
          crates\meka-studio-desktop\windows\meka-studio-desktop.iss
      # The marker makes the copy portable, keeping its data in a data folder beside it.
      - name: Make the portable zip
        if: runner.os == 'Windows'
        run: |
          : > meka-studio-desktop/.portable
          7z a -tzip "meka-studio-desktop-${{ matrix.name }}-portable.zip" meka-studio-desktop
          ls meka-studio-desktop-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meka-studio-desktop-${{ matrix.name }}
          path: meka-studio-desktop-*
          if-no-files-found: error

  publish:
    needs: [binaries, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: meka-studio-*
          merge-multiple: true
          path: release
      - name: Write the notes
        run: |
          chmod +x release/meka-studio-*
          awk -v version="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      # A draft, which goes out once someone has looked it over and published it on GitHub.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --draft --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
